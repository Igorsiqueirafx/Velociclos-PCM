name: Backend Health Ping

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health
        run: |
          curl -sf "${{ secrets.BACKEND_URL }}/api/health" \
            > /dev/null && echo "Backend online: $(date -u)" \
            || { echo "Backend unreachable: $(date -u)"; exit 1; }