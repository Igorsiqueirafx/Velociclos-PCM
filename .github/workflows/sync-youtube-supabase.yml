name: Sync YouTube to Supabase

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @supabase/supabase-js dotenv
      - name: Sync all channel playlists to Supabase
        run: node .kilo/scripts/sync-youtube-to-supabase.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: 'UCwk7RuafgXHRqSmS3qO8qQQ'
          SUPABASE_URL: https://iskzakpvxuowkbzovjxw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
