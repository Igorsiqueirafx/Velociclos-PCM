name: Sync YouTube Playlists

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all channel playlists
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/playlists/sync" \
            -H "Content-Type: application/json" \
            > /dev/null && echo "YouTube playlists synced: $(date -u)" \
            || { echo "YouTube sync failed: $(date -u)"; exit 1; }
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}